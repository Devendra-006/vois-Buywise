services:
  postgres:
    image: postgres:16-alpine
    container_name: buywise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-buywise_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-buywise_secure_pass_2026}
      POSTGRES_DB: ${PG_DATABASE:-buywise_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-buywise_user} -d ${PG_DATABASE:-buywise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buywise-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
