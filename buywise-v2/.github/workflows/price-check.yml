name: Price Check & Alerts Cron

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC
  workflow_dispatch:

jobs:
  run-price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Internal Price Check Endpoint
        run: |
          curl -fsS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.API_URL }}/internal/price-check"
